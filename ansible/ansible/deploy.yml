- name: Deploy java-cicd-app to Kubernetes
  hosts: k8s
  tasks:
    - name: Copy the deployment manifest
      ansible.builtin.template:
        src: ../k8s/deployment.yml.j2
        dest: /home/ubuntu/deployment.yml

    - name: Apply the manifest
      ansible.builtin.command: kubectl apply -f /home/ubuntu/deployment.yml

    - name: Wait until the rollout finishes
      ansible.builtin.command: kubectl rollout status deployment/java-cicd-app --timeout=180s
